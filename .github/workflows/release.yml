name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # Reuse the Security workflow (secret scan, audit, workflow lint, shellcheck)
  # as a gate before publishing anything.
  security:
    uses: ./.github/workflows/security.yml

  release:
    needs: security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Upgrade npm for trusted publishing
        # Trusted publishing (OIDC) requires npm >= 11.5.1; Node 22 bundles npm 10.
        # Pinned (not npm@latest) so tagged releases stay reproducible.
        run: npm install -g npm@11.18.0

      - name: Test
        run: npm test

      - name: Verify package contents
        run: npm run verify-pack

      - name: Pack
        run: npm pack

      - name: Compute checksums
        run: shasum -a 256 -- ./*.tgz > checksums.txt

      # npm trusted publishing uses GitHub OIDC via `permissions: id-token: write`.
      # Configure npmjs.com Trusted Publisher for this package with:
      #   owner/repo: jvm/entur-cli
      #   workflow filename: release.yml
      # No NODE_AUTH_TOKEN is set on purpose.
      - name: Publish to npm
        run: npm publish --provenance --access public

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            *.tgz
            checksums.txt
